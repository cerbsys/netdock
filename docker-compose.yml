services:
  netdock:
    image: ghcr.io/cerbsys/netdock:latest
    container_name: netdock
    restart: unless-stopped
    ports:
      - "8085:8000"
    user: "0:983"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/data
      - ./backend:/app/backend
      - ./frontend/dist:/app/static:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
